name: seal-build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '19.0.1'
      - name: Stage the npm package (upstream scripts/npm_prepublish.sh)
        run: bash scripts/npm_prepublish.sh HEAD
      - name: Pack
        run: |
          cd ../moment-npm
          npm pack
          mkdir -p "$GITHUB_WORKSPACE/seal-dist"
          cp moment-*.tgz "$GITHUB_WORKSPACE/seal-dist/"
          tar -tzf "$GITHUB_WORKSPACE/seal-dist/moment-2.30.1.tgz" | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: moment-npm-tgz
          path: seal-dist/moment-2.30.1.tgz
          if-no-files-found: error
